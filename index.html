<!DOCTYPE html>
<html>
<head>
  <title>Task Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>Create Task</h1>

  <textarea
    id="taskDescription"
    placeholder="Task Description">
  </textarea>

  <input
    type="text"
    id="createdBy"
    placeholder="Created By">

  <button onclick="saveTask()">
    Save Task
  </button>

  <p id="result"></p>

</div>

<script src="script.js"></script>

</body>
</html>
